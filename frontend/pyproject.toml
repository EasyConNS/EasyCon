[project]
name = "easycon-flow"
version = "0.1.0"
description = "EasyCon 编排图（*.flow.json）画布前端：PySide6 + NodeGraphQt，节点全部由后端 /api/nodes 提供"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "PySide6>=6.6",
    "NodeGraphQt>=0.6.44",
    "requests>=2.31",
    # 必需项，不是可选项：NodeGraphQt 0.6.x 仍会 `import distutils`（PySide2 时代遗留），
    # 而 Python >= 3.12 已把 distutils 移出标准库。setuptools 装好后提供 distutils 兼容层
    # （distutils-precedence.pth + _distutils_hack），否则 import NodeGraphQt 直接 ImportError。
    "setuptools>=68",
]

[project.scripts]
easycon-flow = "easycon_flow.main:main"

[project.urls]
Repository = "https://github.com/SlenderData/EasyCon"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/easycon_flow"]

[tool.uv]
# 本项目是应用（非库）：锁定并提交 uv.lock，用 `uv sync` / `uv run` 复现环境。
# 画布自身不发布到 PyPI，console script 仅供本仓库 `uv run easycon-flow` 使用。
package = true
