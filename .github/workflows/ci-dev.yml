name: CI Develop

on:
  workflow_run:
    workflows: ["Auto Fix Format"]
    types:
      - completed  # 在工作流完成时触发
  pull_request:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**/*.md'
      - 'LICENSE'
      - 'README*'
      - 'CHANGELOG*'
  push:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**/*.md'
      - 'LICENSE'
      - 'README*'
      - 'CHANGELOG*'
  merge_group:
    branches: [dev]
    types: [checks_requested]

concurrency:
  group: ci-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  ECSVM_REQUIRE_CC: 1

jobs:
  # ========================================
  # 1. 代码格式检查
  # ========================================
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 检查代码格式
        run: dotnet format --verify-no-changes --verbosity diagnostic

  # ========================================
  # 2. 构建 + 测试 (Debug)
  # ========================================
  build-and-test:
    runs-on: windows-latest
    needs: format
    steps:
      - uses: actions/checkout@v6

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: 还原 NuGet 包
        run: dotnet restore

      - name: 构建 ecs-vm 普通与 budget 档（必须有 C99 工具链）
        shell: bash
        run: sh ci/build-vm.sh budget

      - name: Build (Debug)
        run: dotnet build --no-restore --configuration Debug

      - name: 运行 EasyCon 测试
        run: dotnet test EasyCon2.slnx --no-build -c Debug --logger trx --results-directory TestResults

      - name: Maa 原生宿主无硬件自检
        run: dotnet run --no-build -c Debug --project src/EasyCon2.CLI -- maa doctor | Tee-Object maa-runtime.json

      - name: 上传宿主与测试验收记录
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: host-p1-tests
          path: |
            TestResults/*.trx
            maa-runtime.json

      - name: 串行运行真实窗口保存快捷键回归
        run: >-
          dotnet test test/EasyCon2.Avalonia.UiTests/EasyCon2.Avalonia.UiTests.csproj
          --configuration Debug --no-build
          --filter "FullyQualifiedName~MainWindowSaveTests.CtrlS_SavesLatestEditorTextFromTheFocusedEditor"

  native-abi:
    runs-on: ubuntu-latest
    needs: format
    strategy:
      fail-fast: false
      matrix:
        bits: [64, 32]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: 安装 32 位 C 运行库与工具链
        if: matrix.bits == 32
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: 指定实际 C 编译器
        shell: bash
        run: |
          if [ "${{ matrix.bits }}" = "32" ]; then
            chmod +x ci/cc32.sh
            echo "ECSVM_CC=$PWD/ci/cc32.sh" >> "$GITHUB_ENV"
          else
            echo "ECSVM_CC=/usr/bin/gcc" >> "$GITHUB_ENV"
          fi
      - name: 普通与 budget 构建及容量门禁
        run: sh ci/build-vm.sh budget | tee vm-budget-${{ matrix.bits }}.txt
      - name: 执行 C# 与 C VM 差分及 P0 ABI 回归
        run: >-
          dotnet test test/EasyCon.Tests/EasyCon.Tests.csproj -c Release
          --filter "FullyQualifiedName~Bytecode"
          --logger "trx;LogFileName=native-${{ matrix.bits }}.trx"
          --results-directory TestResults
      - name: 上传原生验收记录
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cvm-p0-${{ matrix.bits }}
          path: |
            vm-budget-*.txt
            TestResults/*.trx

  build-macos:
    if: github.event_name != 'workflow_run'
    runs-on: macos-14
    needs: format
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: 检查 AVFoundation 真实枚举入口（无设备可返回空列表，不请求权限）
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project src/EasyCon2.CLI -c Release -- video --list | tee macos-video-sources.txt
      - name: 打包 macOS .app
        shell: bash
        env:
          CI: "true"
        run: bash ci/macos-app.sh
      - name: 检查发布包的枚举入口并打包
        shell: bash
        run: |
          set -o pipefail
          dist/publish/EasyCon.app/Contents/MacOS/ezcon video --list | tee macos-published-video-sources.txt
          version="$(git rev-parse --short HEAD)"
          ditto -c -k --sequesterRsrc --keepParent dist/publish/EasyCon.app "dist/EasyCon2-${version}-macos-arm64.zip"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: easycon2-macos-arm64
          path: |
            dist/*.zip
            macos-video-sources.txt
            macos-published-video-sources.txt
          if-no-files-found: error
          retention-days: 30
