name: CI Develop

on:
  workflow_run:
    workflows: ["Auto Fix Format"]
    types:
      - completed  # 在工作流完成时触发
  pull_request:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**/*.md'
      - 'LICENSE'
      - 'README*'
      - 'CHANGELOG*'
  push:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**/*.md'
      - 'LICENSE'
      - 'README*'
      - 'CHANGELOG*'
  merge_group:
    branches: [dev]
    types: [checks_requested]

concurrency:
  group: ci-dev-${{ github.event.workflow_run.head_repository.full_name || github.repository }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  ECSVM_REQUIRE_CC: 1

jobs:
  # ========================================
  # 1. 代码格式检查
  # ========================================
  format:
    # Fork 格式检查不写提交，后续构建由 pull_request CI 负责。
    # workflow_run 从默认分支读取本文件；此路由修复须同步到 main。
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-latest
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        id: checkout
        with:
          # 同仓库自动格式化可能新增提交，先解析来源分支，再让后续任务固定到该提交。
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 检查代码格式
        run: dotnet format --verify-no-changes --verbosity diagnostic

  # ========================================
  # 2. 构建 + 测试 (Debug)
  # ========================================
  build-and-test:
    runs-on: windows-latest
    needs: format
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.format.outputs.commit }}

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: 还原 NuGet 包
        run: dotnet restore

      - name: 构建 ecs-vm 普通与 budget 档（必须有 C99 工具链）
        shell: bash
        run: sh ci/build-vm.sh budget

      - name: Build (Debug)
        run: dotnet build --no-restore --configuration Debug

      - name: 运行 EasyCon 测试
        shell: cmd
        run: ci\test.bat Debug

      - name: 串行运行真实窗口保存快捷键回归
        run: >-
          dotnet test test/EasyCon2.Avalonia.UiTests/EasyCon2.Avalonia.UiTests.csproj
          --configuration Debug --no-build
          --filter "FullyQualifiedName~MainWindowSaveTests.CtrlS_SavesLatestEditorTextFromTheFocusedEditor"

  native-abi:
    runs-on: ubuntu-latest
    needs: format
    strategy:
      fail-fast: false
      matrix:
        bits: [64, 32]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.format.outputs.commit }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: 安装 32 位 C 运行库与工具链
        if: matrix.bits == 32
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: 指定实际 C 编译器
        shell: bash
        run: |
          if [ "${{ matrix.bits }}" = "32" ]; then
            chmod +x ci/cc32.sh
            echo "ECSVM_CC=$PWD/ci/cc32.sh" >> "$GITHUB_ENV"
          else
            echo "ECSVM_CC=/usr/bin/gcc" >> "$GITHUB_ENV"
          fi
      - name: 普通与 budget 构建及容量门禁
        run: sh ci/build-vm.sh budget | tee vm-budget-${{ matrix.bits }}.txt
      - name: 执行 C# 与 C VM 差分及 P0 ABI 回归
        run: >-
          dotnet test test/EasyCon.Tests/EasyCon.Tests.csproj -c Release
          --filter "FullyQualifiedName~Bytecode"
          --logger "trx;LogFileName=native-${{ matrix.bits }}.trx"
          --results-directory TestResults
      - name: 上传原生验收记录
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cvm-p0-${{ matrix.bits }}
          path: |
            vm-budget-*.txt
            TestResults/*.trx
