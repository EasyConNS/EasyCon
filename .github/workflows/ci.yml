name: CI (Main)

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**/*.md'
      - 'LICENSE'
      - 'README*'
      - 'CHANGELOG*'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**/*.md'
      - 'LICENSE'
      - 'README*'
      - 'CHANGELOG*'

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  # ========================================
  # 1. 代码格式检查（阻断性）
  # ========================================
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 检查代码格式
        run: dotnet format --verify-no-changes --verbosity diagnostic

  # ========================================
  # 2. 构建 + 测试 (Release)
  # ========================================
  build-and-test:
    runs-on: windows-latest
    needs: format
    steps:
      - uses: actions/checkout@v6

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: 还原 NuGet 包
        run: dotnet restore

      - name: 运行 EasyCon 测试
        shell: cmd
        run: ci\test.bat

      - name: 串行运行真实窗口保存快捷键回归
        run: >-
          dotnet test test/EasyCon2.Avalonia.UiTests/EasyCon2.Avalonia.UiTests.csproj
          --configuration Release --no-build
          --filter "FullyQualifiedName~MainWindowSaveTests.CtrlS_SavesLatestEditorTextFromTheFocusedEditor"

      - name: 发布 EasyCon2
        shell: cmd
        run: ci\windows-x64.bat

      - name: 上传 EasyCon2 产物
        uses: actions/upload-artifact@v6
        with:
          name: EasyCon2-${{ github.run_number }}
          path: dist/publish/
          retention-days: 30

  # ========================================
  # 3. 构建 macOS .app
  # ========================================
  build-macos:
    runs-on: macos-14
    needs: format
    steps:
      - uses: actions/checkout@v6

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: 还原 NuGet 包
        run: dotnet restore

      - name: 构建 ecs-vm（无 C 工具链则跳过）
        shell: bash
        run: sh ci/build-vm.sh

      # macOS 自带 /usr/bin/clang：CvmRunner 能现场编译 ecs-vm，
      # 使托管解释器 ↔ C VM 的差分对拍（Cvm/Corpus/Fuzz/FullChain/Abi）真正执行。
      # 这是双端语义漂移的唯一机械防线，勿移除。
      - name: 运行 EasyCon 测试（含 C VM 差分对拍）
        run: dotnet test EasyCon2.slnx -c Release

      - name: 打包 macOS .app
        shell: bash
        env:
          CI: "true"
        run: bash ci/macos-app.sh

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v6
        with:
          name: easycon2-macos-${{ github.run_number }}
          path: dist/publish/
          retention-days: 30
