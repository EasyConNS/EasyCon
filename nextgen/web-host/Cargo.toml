[package]
name = "easycon-web"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
easycon-sense = { path = ".." }
easycon-device = { path = "../device" }
axum = "0.8.9"
futures-util = "0.3"
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
